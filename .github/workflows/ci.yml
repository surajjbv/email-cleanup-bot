name: CI
on:
  push:
  pull_request:

jobs:
  test:
    # macOS: the kit tests read boot time with sysctl and use macOS process tools.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm test
